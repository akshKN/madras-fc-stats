name: Fetch Madras FC data

on:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours, at :17 past
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write # push to the data branch
  actions: write # keep this schedule from being auto-disabled

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check out the data branch
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git worktree add -B data data-branch FETCH_HEAD
          else
            echo "No data branch yet — creating it"
            git worktree add --orphan -b data data-branch
          fi

      - name: Fetch from EA
        run: npm run poll
        env:
          DATA_DIR: data-branch

      - name: Save data
        if: always()
        working-directory: data-branch
        run: |
          git config user.name "madras-fc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in quiet repos; re-enabling resets that clock.
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/poll.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
