<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Madras FC · Club Stats</title>
  <meta name="description" content="Match-by-match stats, weekly awards and records for Madras FC (EA FC 27 Pro Clubs).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111' stroke='%23e9c43b' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='22' font-family='Arial' font-weight='900' fill='%23e9c43b' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="hero" id="hero" aria-live="polite">
    <div class="wrap"><p class="loading">Loading Madras FC…</p></div>
  </header>
  <div id="banner"></div>
  <main id="main" class="wrap">
    <section id="week" class="card" aria-labelledby="week-h"></section>
    <section id="awards" aria-labelledby="awards-h"></section>
    <section id="charts" class="grid-2"></section>
    <section id="players" class="card" aria-labelledby="players-h"></section>
    <section id="defence" class="card" aria-labelledby="defence-h"></section>
    <section id="extras" class="grid-3"></section>
    <section id="matches" class="card" aria-labelledby="matches-h"></section>
  </main>
  <footer id="footer" class="wrap foot"></footer>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
